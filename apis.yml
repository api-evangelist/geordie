aid: geordie
name: Geordie AI
description: >-
  Geordie AI is an enterprise AI governance platform that gives organizations
  visibility into and control over the autonomous AI agents deployed across their
  environments. It discovers agents across code, cloud, endpoints, and SaaS;
  maps each agent's posture (permissions, tools, MCP connections, and system
  prompts); provides behavioral observability with continuous audit trails and
  anomaly detection; delivers risk intelligence mapped to standards such as OWASP,
  NIST, ISO 42001, and the EU AI Act; and offers Beam, a real-time remediation
  layer that applies deterministic controls at the agent level. Geordie raised a
  $30M Series A and is used by enterprises including Xapo Bank, Fitch Group,
  Synthesia, AlphaSense, Owkin, OakNorth, and A+E Global Media. The company is
  SOC 2, ISO/IEC 27001:2022, and GDPR compliant. This profile was surfaced as a
  portfolio company of Balderton Capital and General Catalyst and enriched by the
  API Evangelist pipeline; Geordie publishes no public developer API.
